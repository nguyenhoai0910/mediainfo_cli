name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller Pillow numpy
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --fix-missing \
            ffmpeg imagemagick libimage-exiftool-perl

      - name: Install ImageMagick 7 (magick)
        uses: mfinelli/setup-imagemagick@v5
        with:
          install-libfuse2: true

      - name: Build binary
        run: |
          pyinstaller --onefile --paths . --name mediainfo main.py

      - name: Test binary
        shell: bash
        run: |
          mkdir -p testimg
          curl -fL --retry 3 -o testimg/1.jpg  https://picsum.photos/id/10/600/400.jpg
          curl -fL --retry 3 -o testimg/2.jpg  https://picsum.photos/id/20/600/400.jpg
          curl -fL --retry 3 -o testimg/3.webp https://picsum.photos/id/30/600/400.webp
          curl -fL --retry 3 -o testimg/4.png  https://httpbin.org/image/png
          ls -la testimg
          ./dist/mediainfo -pt  testimg/1.jpg
          ./dist/mediainfo -pt  testimg/2.jpg
          ./dist/mediainfo -pt  testimg/3.webp
          ./dist/mediainfo -pqt testimg/4.png
          ./dist/mediainfo -diff testimg/1.jpg testimg/2.jpg
          ./dist/mediainfo -diff testimg/1.jpg testimg/4.png
          echo "All tests passed"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: mediainfo-linux
          path: dist/mediainfo

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyinstaller Pillow numpy

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install exiftool imagemagick sha256sum
        run: |
          choco install exiftool imagemagick msys2 -y
          "C:\tools\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $im = (Get-ChildItem "C:\Program Files" -Directory -Filter "ImageMagick*" | Select-Object -First 1).FullName
          $im | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build binary
        run: |
          pyinstaller --onefile --paths . --name mediainfo main.py

      - name: Test binary
        shell: bash
        run: |
          mkdir -p testimg
          curl -fL --retry 3 -o testimg/1.jpg  https://picsum.photos/id/10/600/400.jpg
          curl -fL --retry 3 -o testimg/2.jpg  https://picsum.photos/id/20/600/400.jpg
          curl -fL --retry 3 -o testimg/3.webp https://picsum.photos/id/30/600/400.webp
          curl -fL --retry 3 -o testimg/4.png  https://httpbin.org/image/png
          ls -la testimg
          ./dist/mediainfo.exe -pt  testimg/1.jpg
          ./dist/mediainfo.exe -pt  testimg/2.jpg
          ./dist/mediainfo.exe -pt  testimg/3.webp
          ./dist/mediainfo.exe -pqt testimg/4.png
          ./dist/mediainfo.exe -diff testimg/1.jpg testimg/2.jpg
          ./dist/mediainfo.exe -diff testimg/1.jpg testimg/4.png
          echo "All tests passed"

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: mediainfo-windows
          path: dist/mediainfo.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: mediainfo-linux

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: mediainfo-windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mediainfo
            mediainfo.exe
